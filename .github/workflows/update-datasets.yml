name: Update AI dataset index

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is this refresh being run?"
        required: false
        default: "manual refresh"

permissions:
  contents: write

concurrency:
  group: dataset-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Collect and rank datasets
        run: node scripts/fetch-datasets.mjs

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- src/data/datasets.json; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/datasets.json
          git commit -m "data: refresh AI dataset index"
          git push

